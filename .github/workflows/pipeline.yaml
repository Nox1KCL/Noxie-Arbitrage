name: Testing

on:
  push:
    branches:
      - main

jobs:
  go-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: go mod download
      - uses: go test -v -race -count=1 -timeout 5m ./...

  python-testing:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./parsers

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: '3.13'
        - uses: uv sync
        - uses: uv run pytest -v
