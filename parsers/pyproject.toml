[project]
name = "parsers"
version = "0.1.0"
description = "Microservice for arbitrage"
requires-python = ">=3.13"
dependencies = [
    "aio-pika",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.0",
]

[tool.uv]
package = true

[tool.uv.sources]
parsers = { workspace = true }
